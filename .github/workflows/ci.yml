name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: './BinanceAutomationFramework/BinanceAutomationFramework.sln'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
      
    - name: Run unit tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --filter "Category=Unit" --logger "trx;LogFileName=unit-test-results.trx" --verbosity normal --results-directory TestResults
      
    - name: Run integration tests
      env:
        BINANCEAPI__APIKEY: ${{ secrets.BINANCE_API_KEY }}
        BINANCEAPI__BASEURL: "https://binance43.p.rapidapi.com"
        BINANCEAPI__APIHOST: "binance43.p.rapidapi.com"
      run: |
        echo "=========================================="
        echo "  Integration Tests"
        echo "=========================================="
        echo ""
        echo "⚠️  Note: Tests may skip if geo-blocked (HTTP 451)"
        echo "      This is a known RapidAPI limitation with GitHub Actions"
        echo ""
        dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration-test-results.trx" --verbosity normal --results-directory TestResults
        echo ""
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          TestResults/**/*.trx
          **/results/*.json
        retention-days: 30