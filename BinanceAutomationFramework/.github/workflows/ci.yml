name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch: # Allow manual trigger

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: './BinanceAutomationFramework'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-path: |
          ~/.nuget/packages
          
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore
      
    - name: Run unit tests
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --filter "FullyQualifiedName~Unit" --logger "trx;LogFileName=unit-test-results.trx" --collect:"XPlat Code Coverage"
      
    - name: Run integration tests
      env:
        BINANCEAPI__APIKEY: ${{ secrets.BINANCE_API_KEY }}
        BINANCEAPI__BASEURL: "https://binance43.p.rapidapi.com"
        BINANCEAPI__APIHOST: "binance43.p.rapidapi.com"
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=integration-test-results.trx"
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          **/TestResults/*.trx
          **/results/*.json
        retention-days: 30
        
    - name: Upload JSON reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: top-gainers-reports
        path: |
          **/results/top_gainers_*.json
        retention-days: 7
        
    - name: Test Summary
      uses: test-reporter/action@v1
      if: always()
      with:
        name: Test Results
        path: '**/TestResults/*.trx'
        reporter: dotnet-trx
        fail-on-error: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}
      
    - name: Check code formatting
      run: dotnet format ${{ env.SOLUTION_PATH }} --verify-no-changes --verbosity diagnostic
      continue-on-error: true
      
    - name: Run build warnings check
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release -warnaserror
      continue-on-error: true